var KEY='sanyuan_v13';
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}

function blank(){
  return {
    catName:null,mood:50,gold:50,inventory:[],postCards:[],playDays:0,
    furniture:{indoorPlant:false,fountain:false,ladder:false,rock:false,slide:false},
    lastDay:'',daily:{fed:false,bath:false,litter:false,pet:false,single:false,reward:false},
    lastOnlineDay:'',lastYear:new Date().getFullYear(),
    festivalFlags:{spring:false,yuanxiao:false,duanwu:false,midautumn:false,xmas:false}
  };
}

var s=null;
try{
  var raw=localStorage.getItem(KEY);
  if(raw&&raw.length>2&&raw!=='undefined'&&raw!=='null')s=JSON.parse(raw);
}catch(e){s=null;}
if(!s||typeof s!=='object')s=blank();
if(!s.inventory)s.inventory=[];
if(!s.postCards)s.postCards=[];
if(!s.furniture)s.furniture=blank().furniture;
if(!s.daily)s.daily={fed:false,bath:false,litter:false,pet:false,single:false,reward:false};
if(!s.lastDay)s.lastDay='';
if(!s.lastOnlineDay)s.lastOnlineDay='';
if(!s.lastYear)s.lastYear=new Date().getFullYear();
if(!s.festivalFlags)s.festivalFlags=blank().festivalFlags;
if(typeof s.playDays!=='number')s.playDays=1;

var scene='outside';
var yardPos=null;
var roomPos=null;

function pick(a){return a[Math.floor(Math.random()*a.length)]}
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},1600)}
function closeM(){stopBird();document.getElementById('overlay').style.display='none'}

function resetSave(){
  if(!confirm('⚠️ 确定要清空存档吗？\n所有猫、金币、明信片、家具都会消失。'))return;
  try{localStorage.removeItem(KEY)}catch(e){}
  s=blank();
  scene='outside';
  yardPos=null;
  roomPos=null;
  closeM();
  render();
  setTimeout(chooseCat,300);
}

function meow(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!window._ac)window._ac=new AC();
    var ac=window._ac;
    var o=ac.createOscillator();
    var g=ac.createGain();
    o.type='triangle';
    var t=ac.currentTime;
    o.frequency.setValueAtTime(520,t);
    o.frequency.linearRampToValueAtTime(700,t+0.06);
    o.frequency.exponentialRampToValueAtTime(380,t+0.22);
    o.frequency.exponentialRampToValueAtTime(460,t+0.32);
    g.gain.setValueAtTime(0.001,t);
    g.gain.linearRampToValueAtTime(0.14,t+0.04);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.36);
    o.connect(g);g.connect(ac.destination);
    o.start(t);o.stop(t+0.38);
  }catch(e){}
}

function checkDay(){
  var d=today();
  if(s.lastDay!==d){
    if(s.lastDay!=='')s.playDays++;
    s.lastDay=d;
    s.daily={fed:false,bath:false,litter:false,pet:false,single:false,reward:false};
    try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}
  }
}

function checkFestival(){
  var now=new Date();
  var m=now.getMonth()+1;
  var d=now.getDate();
  var y=now.getFullYear();
  if(s.lastYear!==y){
    s.lastYear=y;
    s.festivalFlags={spring:false,yuanxiao:false,duanwu:false,midautumn:false,xmas:false};
  }
  for(var k in FEST){
    var F=FEST[k];
    if(s.festivalFlags[F.flag])continue;
    for(var i=0;i<F.dates.length;i++){
      if(F.dates[i][0]===m&&F.dates[i][1]===d){
        s.festivalFlags[F.flag]=true;
        return F;
      }
    }
  }
  return null;
}

var tickTimer=null;
function startCatTick(){
  if(tickTimer)clearTimeout(tickTimer);
  tickTimer=setTimeout(function(){
    var cat=document.getElementById('roomCat');
    if(cat){
      var inner=cat.querySelector('.cat-anim');
      if(inner&&Math.random()<0.6){
        inner.classList.add('cat-hop');
        setTimeout(function(){inner.classList.remove('cat-hop')},600);
      }
    }
    startCatTick();
  },3500+Math.random()*4000);
}

function goto(x){
  if(x==='yard')yardPos=null;
  if(x==='room')roomPos=null;
  scene=x;render();
}

function pet(){
  if(!s.catName)return;
  checkDay();
  var first=s.daily.pet===false;
  if(first){
    s.mood=Math.min(100,s.mood+8);
    s.daily.pet=true;
    toast('💖 +8');
  }else{
    toast(CATS[s.catName].petText||'💕 猫咪开心地蹭了蹭你');
  }
  render();
  setTimeout(function(){
    var box=document.querySelector('.scene');
    if(!box)return;
    var h=CATS[s.catName].heart;
    var baseY=(scene==='yard'&&yardPos)?yardPos[1]:(scene==='room'&&roomPos?roomPos[1]:58);
    for(var i=0;i<5;i++){
      (function(i){
        setTimeout(function(){
          var el=document.createElement('span');
          el.className='heart';el.textContent=h;
          el.style.left=(38+Math.random()*24)+'%';
          el.style.top=baseY+'%';
          box.appendChild(el);
          setTimeout(function(){el.remove()},1800);
        },i*70);
      })(i);
    }
  },60);
}

function save(){try{localStorage.setItem(KEY,JSON.stringify(s));toast('💾 已保存')}catch(e){toast('保存失败')}}

function chooseCat(){
  var html='<h3>🐈 选择猫咪</h3>';
  for(var n in CATS){
    var c=CATS[n];
    html+='<button class="opt" onclick="pickCat(\''+n+'\')" style="display:flex;align-items:center;gap:12px">'+
      '<img src="'+c.img+'" style="width:48px;height:48px;object-fit:contain">'+
      '<span>'+n+'｜'+c.job+'</span></button>';
  }
  document.getElementById('modal').innerHTML=html;
  document.getElementById('overlay').style.display='flex';
}
function pickCat(n){
  s.catName=n;closeM();render();toast('🐈 欢迎 '+n);
  setTimeout(function(){
    var F=checkFestival();
    if(F){showFestival(F);return;}
    checkOnline();
  },900);
}

function doBath(){
  checkDay();
  if(s.daily.bath){toast('今天已经洗过澡啦～');return;}
  s.daily.bath=true;
  s.mood=Math.max(0,Math.min(100,s.mood+12));
  toast('💖 +12');render();catPanel();
}
function doLitter(){
  checkDay();
  if(s.daily.litter){toast('今天已经铲过猫砂啦～');return;}
  s.daily.litter=true;
  s.mood=Math.max(0,Math.min(100,s.mood+5));
  toast('💖 +5');render();catPanel();
}

function feedPanel(){
  checkDay();
  var c=CATS[s.catName];
  var html='<div style="text-align:center"><img src="'+c.img+'" style="width:60px;height:60px;object-fit:contain"></div>'+
    '<h3>🍽 喂食｜'+s.catName+'</h3>'+
    '<p style="text-align:center;font-size:12px;color:#806f60">💖 '+s.mood+'/100　💰 '+s.gold+'</p>';
  if(s.daily.fed){
    html+='<p style="text-align:center;padding:14px;color:#806f60">✅ 今天已经喂过啦～ 明天再来吧</p>';
  }else if(s.inventory.length===0){
    html+='<p style="text-align:center;padding:14px;color:#806f60">背包空空如也，点下方按钮去买点吃的吧。</p>';
  }else{
    var counts={};
    for(var i=0;i<s.inventory.length;i++){
      var n=s.inventory[i];counts[n]=(counts[n]||0)+1;
    }
    for(var name in counts){
      var food=null;
      for(var k=0;k<FOOD_SHOP.length;k++){if(FOOD_SHOP[k][1]===name){food=FOOD_SHOP[k];break;}}
      var icon=food?food[0]:'🍽';
      var tag='';
      if(c.like.indexOf(name)>=0)tag=' ⭐';
      else if(c.dislike.indexOf(name)>=0)tag=' ❌';
      html+='<div class="item"><div class="info"><div class="name">'+icon+' '+name+' × '+counts[name]+tag+'</div></div>'+
        '<button onclick="feed(\''+name+'\')">喂食</button></div>';
    }
  }
  html+='<button class="opt" style="text-align:center;margin-top:16px" onclick="openFoodShop()">🛒 去购买食物</button>'+
    '<button class="opt" style="text-align:center;background:#e8ddd0" onclick="catPanel()">返回照顾面板</button>';
  document.getElementById('modal').innerHTML=html;
  document.getElementById('overlay').style.display='flex';
}
function feed(name){
  checkDay();
  if(s.daily.fed){toast('今天已经喂过啦～');return;}
  var i=s.inventory.indexOf(name);
  if(i<0)return;
  var c=CATS[s.catName];
  var v=6;
  var msg='💖 +6';
  if(c.like.indexOf(name)>=0){v=10;msg='💖 +10 ⭐ 很喜欢';}
  else if(c.dislike.indexOf(name)>=0){v=-3;msg='💔 -3 不太喜欢';}
  s.inventory.splice(i,1);s.daily.fed=true;
  s.mood=Math.max(0,Math.min(100,s.mood+v));
  toast(msg);render();feedPanel();
}

function openFoodShop(){
  var html='<h3>🛒 食物商店</h3><p class="hint">当前金币：💰 '+s.gold+'　背包：'+s.inventory.length+' 件</p>';
  for(var i=0;i<FOOD_SHOP.length;i++){
    var f=FOOD_SHOP[i];
    html+='<div class="item"><div class="info"><div class="name">'+f[0]+' '+f[1]+'</div><div class="desc">'+f[2]+' · '+f[3]+' 金币</div></div>'+
      '<button onclick="buyFood('+i+')">购买</button></div>';
  }
  html+='<button class="opt" style="text-align:center;margin-top:12px" onclick="feedPanel()">返回喂食</button>'+
    '<button class="opt" style="text-align:center;background:#e8ddd0" onclick="closeM()">关闭</button>';
  document.getElementById('modal').innerHTML=html;
  document.getElementById('overlay').style.display='flex';
}
function buyFood(i){
  var f=FOOD_SHOP[i];
  if(s.gold<f[3]){toast('💸 余额不足');return;}
  s.gold-=f[3];s.inventory.push(f[1]);
  toast('🛒 已购入 '+f[1]);render();openFoodShop();
}

function openFurnShop(){
  var html='<h3>🛍 家具商店</h3><p class="hint">当前金币：💰 '+s.gold+'</p>';
  for(var i=0;i<FURN_SHOP.length;i++){
    var f=FURN_SHOP[i];
    var owned=s.furniture[f[0]];
    html+='<div class="item"><div class="info"><div class="name">'+f[1]+' '+f[2]+'</div><div class="desc">'+f[3]+' · '+f[4]+' 金币</div></div>'+
      '<button onclick="buyFurn(\''+f[0]+'\','+f[4]+')" '+(owned?'disabled':'')+'>'+(owned?'已拥有':'购买')+'</button></div>';
  }
  html+='<button class="opt" style="text-align:center;margin-top:12px" onclick="closeM();doorMenu()">返回大门</button>'+
    '<button class="opt" style="text-align:center;background:#e8ddd0" onclick="closeM()">关闭</button>';
  document.getElementById('modal').innerHTML=html;
  document.getElementById('overlay').style.display='flex';
}
function buyFurn(key,price){
  if(s.gold<price){toast('💸 余额不足');return;}
  s.gold-=price;s.furniture[key]=true;render();closeM();
  setTimeout(function(){
    var f=FURN[key];var ev=f.lines[s.catName];
    var opts=[[ev[1],ev[2]],[ev[3],ev[4]],[ev[5],ev[6]]];
    for(var i=opts.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var tmp=opts[i];opts[i]=opts[j];opts[j]=tmp;
    }
    var html='<div style="font-size:40px;text-align:center">'+f.icon+'</div>'+
      '<h3>'+f.name+'｜'+s.catName+'</h3><p style="line-height:1.7">'+ev[0]+'</p>';
    for(var k=0;k<opts.length;k++){
      html+='<button class="opt" onclick="furnChoice('+opts[k][1]+')">'+'ABC'[k]+'：'+opts[k][0]+'</button>';
    }
    document.getElementById('modal').innerHTML=html;
    document.getElementById('overlay').style.display='flex';
  },250);
}
function furnChoice(v){
  s.mood=Math.max(0,Math.min(100,s.mood+v));
  closeM();toast('💖 +'+v);render();
}

function travel(){
  var html='<h3>🚏 旅行任务</h3>'+
    '<p class="hint">金币任务 -20 出发（选对能 +40 金币）；明信片任务 -10 出发。</p>'+
    '<button class="opt" onclick="closeM();doTravel(\'gold\')">🚞 金币任务（-20 出发）</button>'+
    '<button class="opt" onclick="closeM();doTravel(\'card\')">🖼 明信片旅行（-10 出发）</button>'+
    '<button class="opt" style="text-align:center;background:#e8ddd0" onclick="closeM()">关闭</button>';
  document.getElementById('modal').innerHTML=html;
  document.getElementById('overlay').style.display='flex';
}

function doTravel(type){
  if(type==='gold'){
    if(s.gold<20){toast('💸 金币不足，需要 20');return;}
    s.gold-=20;
    var ev=pick(GOLD);
    var opts=[
      {text:ev[1],mood:ev[2],gold:0},
      {text:ev[3],mood:0,gold:ev[4]},
      {text:ev[5],mood:ev[6],gold:0}
    ];
    for(var i=opts.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=opts[i];opts[i]=opts[j];opts[j]=t;
    }
    var html='<div style="font-size:40px;text-align:center">🚏</div>'+
      '<h3>旅行·金币任务</h3><p>'+ev[0]+'</p>';
    for(var k=0;k<opts.length;k++){
      html+='<button class="opt" onclick="chooseTravel('+opts[k].mood+','+opts[k].gold+')">'+'ABC'[k]+'：'+opts[k].text+'</button>';
    }
    html+='<button class="opt" style="text-align:center;background:#e8ddd0" onclick="closeM()">稍后处理</button>';
    document.getElementById('modal').innerHTML=html;
    document.getElementById('overlay').style.display='flex';
    render();
  }else{
    if(s.gold<10){toast('💸 金币不足，需要 10');return;}
    s.gold-=10;
    var collected=[];
    for(var i=0;i<CARD.length;i++){
      if(s.postCards.indexOf(CARD[i][0])>=0)collected.push(CARD[i]);
    }
    var ev;
    if(collected.length>0&&Math.random()<0.3){
      ev=pick(collected);
    }else{
      ev=pick(CARD);
    }
    var opts=[[ev[3],ev[4]],[ev[5],ev[6]],[ev[7],ev[8]]];
    for(var i=opts.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=opts[i];opts[i]=opts[j];opts[j]=t;
    }
    var html='<div style="font-size:40px;text-align:center">'+ev[0]+'</div>'+
      '<h3>🚏 '+ev[1]+'</h3><p>猫咪来到'+ev[1]+'，'+ev[2]+'</p>';
    for(var k=0;k<opts.length;k++){
      html+='<button class="opt" onclick="chooseCard(\''+ev[0]+'\','+opts[k][1]+')">'+'ABC'[k]+'：'+opts[k][0]+'</button>';
    }
    html+='<button class="opt" style="text-align:center;background:#e8ddd0" onclick="closeM()">稍后处理</button>';
    document.getElementById('modal').innerHTML=html;
    document.getElementById('overlay').style.display='flex';
    render();
  }
}

function chooseTravel(mood,gold){
  if(mood>0)s.mood=Math.max(0,Math.min(100,s.mood+mood));
  if(gold>0)s.gold+=gold;
  closeM();
  var msg='';
  if(mood>0)msg+='💖 +'+mood+' ';
  if(gold>0)msg+='💰 +'+gold;
  toast(msg);render();
}

function chooseCard(emoji,mood){
  s.mood=Math.max(0,Math.min(100,s.mood+mood));
  if(s.postCards.indexOf(emoji)<0){
    s.postCards.push(emoji);
    toast('🗓 明信片解锁！💖 +'+mood);
  }else{
    var coins=[9,10,15];
    var g=coins[Math.floor(Math.random()*3)];
    s.gold+=g;
    toast('💖 +'+mood+'　💰 +'+g+'（重游）');
  }
  closeM();render();
}

function postcards(){
  var html='<h3>🗓 明信片图鉴</h3><p class="hint">已收集 '+s.postCards.length+'/16</p>'+
    '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px">';

    var c=CARD[i];

    var locked=got?'':'opacity:.22;filter:grayscale(1);';

  }
  html+='</div><button class="opt" style="text-align:center;background:#e8ddd0;margin-top:12px" onclick="closeM()">关闭</button>';
  document.getElementById('modal').innerHTML=html;
  document.getElementById('overlay').style.display='flex';
}

function checkOnline(){

  var ev=pick(ONLINE);

function onlineChoose(v){
  s.mood=Math.max(0,Math.min(100,s.mood+v));

}

function showFestival(F){
  var ev=pick(F.sets);
  var opts=[[ev[1],ev[2]],[ev[3],ev[4]],[ev[5],ev[6]]];

  document.getElementById('modal').innerHTML=html;

var birdRunning=false,birdObjs=[],birdScore=0,birdStart=0,birdSpawnTimer=null,birdLoopId=null,birdMiss=0;
var BIRD_LINE=100;

function birdGame(){
  closeM();
  var html='<h3>🐦🎶 小鸟音符</h3>'+
    '<p class="hint">小鸟落到判定线时点对应轨道。累计 5 次失误自动结束。</p>'+
    '<div id="gameWrap" style="position:relative;width:100%;height:320px;background:linear-gradient(#dbeafe,#e0f2fe);border-radius:14px;overflow:hidden;margin-top:8px"></div>'+
    '<div style="display:flex;gap:8px;margin-top:10px">'+
      '<button class="btn" style="flex:1;margin-top:0" onpointerdown="birdHit(0)">🔵 左</button>'+
      '<button class="btn" style="flex:1;margin-top:0" onpointerdown="birdHit(1)">🔷 中</button>'+
      '<button class="btn" style="flex:1;margin-top:0" onpointerdown="birdHit(2)">🔵 右</button>'+
    '</div>'+
    '<button class="opt" style="text-align:center;background:#e8ddd0;margin-top:12px" onclick="birdQuit()">关闭</button>';
  document.getElementById('modal').innerHTML=html;
  document.getElementById('overlay').style.display='flex';
  setTimeout(startBird,100);
}

function startBird(){
  var wrap=document.getElementById('gameWrap');
  if(!wrap)return;
  birdObjs=[];birdScore=0;birdMiss=0;birdStart=performance.now();birdRunning=true;
  wrap.innerHTML='';
  var line=document.createElement('div');
  line.style.cssText='position:absolute;left:0;right:0;bottom:'+BIRD_LINE+'px;height:3px;background:#3b82f6;box-shadow:0 0 8px #3b82f6;';
  wrap.appendChild(line);
  for(var i=1;i<3;i++){
    var sep=document.createElement('div');
    sep.style.cssText='position:absolute;top:0;bottom:0;left:'+(i*33.33)+'%;width:1px;background:#0001;';
    wrap.appendChild(sep);
  }
  var sc=document.createElement('div');
  sc.id='birdScore';
  sc.style.cssText='position:absolute;top:8px;left:12px;font-size:15px;color:#1e40af;font-weight:bold;';
  sc.textContent='得分：0　失误：0/5';
  wrap.appendChild(sc);
  function spawn(){
    if(!birdRunning)return;
    var kinds=[['🐦',40],['🐦‍⬛',25],['🕊',20],['🍃',15]];
    var r=Math.random()*100,acc=0,picked='🐦';
    for(var i=0;i<kinds.length;i++){acc+=kinds[i][1];if(r<acc){picked=kinds[i][0];break;}}
    var lane=Math.floor(Math.random()*3);
    var el=document.createElement('div');
    el.className='birdLane';
    el.textContent=picked;
    el.style.left=(lane*33.33)+'%';
    el.style.top='-40px';
    wrap.appendChild(el);
    birdObjs.push({el:el,lane:lane,y:-40});
    birdSpawnTimer=setTimeout(spawn,320+Math.random()*450);
  }
  spawn();
  function loop(){
    if(!birdRunning)return;
    var elapsed=(performance.now()-birdStart)/1000;
    var speed=70*(1+Math.min(elapsed/25,1)*0.9);
    var lineY=wrap.clientHeight-BIRD_LINE;
    for(var i=birdObjs.length-1;i>=0;i--){
      var o=birdObjs[i];
      o.y+=speed/60;
      o.el.style.top=o.y+'px';
      if(o.y>lineY+25){
        o.el.remove();birdObjs.splice(i,1);
        birdMiss++;
        var sc2=document.getElementById('birdScore');
        if(sc2)sc2.textContent='得分：'+birdScore+'　失误：'+birdMiss+'/5';
        if(birdMiss>=5){
          birdRunning=false;
          if(birdSpawnTimer){clearTimeout(birdSpawnTimer);birdSpawnTimer=null;}
          if(birdLoopId){cancelAnimationFrame(birdLoopId);birdLoopId=null;}
          setTimeout(function(){birdQuit();},250);
          return;
        }
      }
    }
    birdLoopId=requestAnimationFrame(loop);
  }
  loop();
}

function birdHit(lane){
  if(!birdRunning)return;
  meow();
  var wrap=document.getElementById('gameWrap');
  if(!wrap)return;
  var lineY=wrap.clientHeight-BIRD_LINE;
  var best=null,bestDist=999;
  for(var i=0;i<birdObjs.length;i++){
    var o=birdObjs[i];
    if(o.lane!==lane)continue;
    var d=Math.abs(o.y-lineY);
    if(d<bestDist){bestDist=d;best=o;}
  }
  if(best&&bestDist<62){
    best.el.style.transition='opacity .25s, transform .25s';
    best.el.style.opacity='0';
    best.el.style.transform='scale(1.5)';
    var el=best.el;
    setTimeout(function(){el.remove()},280);
    birdObjs=birdObjs.filter(function(o){return o!==best});
    birdScore+=10;
    var sc=document.getElementById('birdScore');
    if(sc)sc.textContent='得分：'+birdScore+'　失误：'+birdMiss+'/5';
  }
}

function birdQuit(){
  stopBird();
  var moodReward=Math.floor(birdScore/20);
  if(moodReward>10)moodReward=10;
  var coinReward=0;
  if(birdScore>=60)coinReward=1;
  if(birdScore>=150)coinReward=2;
  if(birdScore>=300)coinReward=3;
  if(moodReward>0)s.mood=Math.max(0,Math.min(100,s.mood+moodReward));
  if(coinReward>0)s.gold+=coinReward;
  render();
  var endReason=(birdMiss>=5)?'失误 5 次，游戏结束':'手动结束';
  var html='<div style="font-size:40px;text-align:center">🎉</div>'+
    '<h3>音游结束</h3>'+
    '<p style="text-align:center;font-size:12px;color:#806f60">'+endReason+'</p>'+
    '<p style="text-align:center;font-size:18px">得分：'+birdScore+'</p>'+
    '<p style="text-align:center">'+(moodReward>0?'💖 +'+moodReward+'　':'')+(coinReward>0?'💰 +'+coinReward:'（无奖励）')+'</p>'+
    '<button class="opt" style="text-align:center" onclick="closeM()">好</button>';
  document.getElementById('modal').innerHTML=html;
  document.getElementById('overlay').style.display='flex';
}

function stopBird(){
  birdRunning=false;
  if(birdSpawnTimer){clearTimeout(birdSpawnTimer);birdSpawnTimer=null;}
  if(birdLoopId){cancelAnimationFrame(birdLoopId);birdLoopId=null;}
}

function taskMenu(){
  if(!s.catName){chooseCat();return}
  checkDay();
  if(s.mood<60){toast('💖 猫咪心情太低了，先陪陪它吧～');return}
  var singleMark=s.daily.single?'✅ ':'';
  var rewardMark=s.daily.reward?'✅ ':'';
  var html='<h3>📜 任务</h3>'+
    '<p class="hint">职业任务扣 10 心情，额外 +5 金币；单人事件 / 悬赏每天限一次，不扣心情。</p>'+
    '<button class="opt" onclick="closeM();jobEvent()">📞 职业任务（'+s.catName+'｜'+CATS[s.catName].job+'）</button>'+
    '<button class="opt" onclick="closeM();singleEvent()">'+singleMark+'☎️ 单人普通随机事件</button>'+
    '<button class="opt" onclick="closeM();rewardEvent()">'+rewardMark+'📞 联机悬赏任务</button>'+
    '<button class="opt" style="text-align:center;background:#e8ddd0" onclick="closeM()">关闭</button>';
  document.getElementById('modal').innerHTML=html;
  document.getElementById('overlay').style.display='flex';
}
function jobEvent(){var ev=pick(JOB[s.catName]);showTask('📞',s.catName+'｜'+CATS[s.catName].job,ev,'job')}
function singleEvent(){
  checkDay();
  if(s.daily.single){toast('今天已经做过单人事件啦～');return;}
  var ev=pick(SINGLE);showTask('☎️','单人普通随机事件',ev,'single');
}
function rewardEvent(){
  checkDay();
  if(s.daily.reward){toast('今天已经做过联机悬赏啦～');return;}
  var ev=pick(REWARD);showTask('📞','联机悬赏任务',ev,'reward');
}

function showTask(icon,title,ev,type){
  var opts;
  if(type==='reward'){
    opts=[[ev[1],ev[2]],[ev[3],ev[4]]];
  }else{
    opts=[[ev[1],ev[2]],[ev[3],ev[4]],[ev[5],ev[6]]];
  }
  for(var i=opts.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=opts[i];opts[i]=opts[j];opts[j]=tmp;
  }
  var html='<div style="font-size:40px;text-align:center">'+icon+'</div>'+
    '<h3>'+title+'</h3><p>'+ev[0]+'</p>';
  for(var k=0;k<opts.length;k++){
    html+='<button class="opt" onclick="chooseTask(\''+opts[k][1]+'\',\''+type+'\')">'+'ABC'[k]+'：'+opts[k][0]+'</button>';
  }
  html+='<button class="opt" style="text-align:center;background:#e8ddd0" onclick="closeM()">稍后处理</button>';
  document.getElementById('modal').innerHTML=html;
  document.getElementById('overlay').style.display='flex';
}

function parseVal(v){
  var sv=String(v);
  if(sv.indexOf('|')>=0){
    var p=sv.split('|');
    return [parseInt(p[0])||0,parseInt(p[1])||0];
  }
  return [parseInt(sv)||0,0];
}

function chooseTask(v,type){
  checkDay();
  if(type==='single')s.daily.single=true;
  if(type==='reward')s.daily.reward=true;
  var pv=parseVal(v);
  var moodV=pv[0];
  var goldV=pv[1];
  var decay=(type==='job')?10:0;
  s.mood=Math.max(0,Math.min(100,s.mood+moodV-decay));
  var goldGain=goldV;
  if(type==='job')goldGain+=5;
  else if(type==='single')goldGain+=3;
  s.gold=Math.max(0,s.gold+goldGain);
  closeM();
  var msg='💖 +'+moodV;
  if(decay>0)msg+=' -'+decay;
  if(goldGain>0)msg+='　💰 +'+goldGain;
  else if(goldGain<0)msg+='　💰 '+goldGain;
  toast(msg);
  render();
}

render();
if(!s.catName){
  setTimeout(chooseCat,300);
}else{
  setTimeout(function(){
    var F=checkFestival();
    if(F){showFestival(F);return;}
    checkOnline();
  },900);
}
